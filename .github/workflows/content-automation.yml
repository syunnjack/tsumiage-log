name: Repository article automation

on:
  schedule:
    # 毎時15分に公開リポジトリの変更を確認
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: repository-article-automation
  cancel-in-progress: false

jobs:
  update-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      articles_changed: ${{ steps.changes.outputs.changed }}
      queued_count: ${{ steps.queue.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record current article count
        id: before
        run: node scripts/write-article-count.mjs

      - name: Collect public repository changes
        run: npm run content:collect

      - name: Refresh video production queue
        run: npm run video:queue

      - name: Count queued videos
        id: queue
        run: echo "count=$(node -p 'require("./app/data/video-production.json").videos.filter((video) => video.status === "queued").length')" >> "$GITHUB_OUTPUT"

      - name: Report policy exclusions
        run: |
          node -e 'const d=require("./app/data/repositories.json"); const names=d.skippedRepositories||[]; console.log(`自動除外: ${names.length}件${names.length ? ` (${names.join(", ")})` : ""}`)' >> "$GITHUB_STEP_SUMMARY"

      - name: Audit content policy and article quality
        id: audit
        run: npm run content:audit

      - name: Audit original articles
        run: npm run manual:audit

      - name: Validate site
        run: |
          npm run copy:audit
          npm run video:audit
          npm run video:assets:audit
          npm run lint
          npm run build

      - name: Close resolved failure alert
        run: |
          title="記事自動化エラー"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "再実行が正常に監査とビルドを通過したため、自動的にクローズします。"
          fi

      - name: Detect updates
        id: changes
        run: |
          if git diff --quiet -- app/data/repositories.json app/data/video-production.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push article updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/repositories.json app/data/video-production.json
          git commit -m "Update repository articles from GitHub activity"
          git push

      - name: Start GitHub Pages deployment
        # 更新時はmainへのpushでdeploy.ymlが自動起動するため、重複実行しない
        if: steps.changes.outputs.changed == 'false' && github.event_name == 'workflow_dispatch'
        run: gh workflow run deploy.yml --ref main

      - name: Create or update publication alert
        if: steps.changes.outputs.changed == 'true'
        env:
          BEFORE_COUNT: ${{ steps.before.outputs.count }}
          AFTER_COUNT: ${{ steps.audit.outputs.article_count }}
          WARNING_COUNT: ${{ steps.audit.outputs.warning_count }}
        run: |
          title="記事自動更新: GitHub Pages反映開始"
          queued_count="$(node -p 'require("./app/data/video-production.json").videos.filter((video) => video.status === "queued").length')"
          body="GitHubの新しいコミットを検出し、記事データを更新しました。

          - 更新前の記事数: ${BEFORE_COUNT}
          - 更新後の記事数: ${AFTER_COUNT}
          - 品質警告: ${WARNING_COUNT}
          - 動画制作待ち: ${queued_count}本
          - 実行結果: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          GitHub Pagesの公開処理を開始しました。"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh label create content-automation --color 1f6f55 --description "記事自動化からの通知" --force
            gh issue create --title "$title" --body "$body" --label content-automation
          fi

      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "公開リポジトリに記事更新が必要な変更はありませんでした。" >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on automation failure
        if: failure()
        run: |
          title="記事自動化エラー"
          body="記事自動化が失敗しました。秘密情報や禁止コンテンツは公開されていません。

          実行結果: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh label create content-automation --color b42318 --description "記事自動化からの通知" --force
            gh issue create --title "$title" --body "$body" --label content-automation
          fi

  # 動画レンダリングはこのワークフローでは行わない。
  # スライド生成に使う @oai/artifact-tool は npm で配布されておらず、
  # 作者の PC の Codex ランタイム内にしか存在しないため、GitHub の runner では
  # 必ず失敗する（毎時 failure の原因になっていた）。
  # 制作待ちが出たら手元で次を実行してコミットする:
  #   npm run video:batch          （キューにある分をまとめて）
  #   npm run video:render -- -Slug <slug>   （1本だけ）
  #   node scripts/build-video-captions.mjs --only <slug>   （字幕）

  report-automation:
    name: Report automation result
    needs: [update-articles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTICLE_RESULT: ${{ needs.update-articles.result }}
      ARTICLE_CHANGED: ${{ needs.update-articles.outputs.articles_changed }}
      QUEUED_COUNT: ${{ needs.update-articles.outputs.queued_count }}

    steps:
      - name: Create hourly success or failure notification
        run: |
          title="積み上げログ自動化稼働報告"
          if [ "$ARTICLE_RESULT" = "success" ]; then
            result="成功"
          else
            result="失敗"
          fi
          # 動画は手元でレンダリングする運用のため、制作待ちが残っていても失敗にはしない
          video_note="なし"
          if [ -n "$QUEUED_COUNT" ] && [ "$QUEUED_COUNT" != "0" ]; then
            video_note="${QUEUED_COUNT}本（手元で npm run video:batch を実行してください）"
          fi
          body="積み上げログの自動更新を実行しました。

          - 結果: ${result}
          - 記事更新: ${ARTICLE_RESULT}
          - 記事差分: ${ARTICLE_CHANGED:-false}
          - 制作待ち動画: ${video_note}
          - 実行結果: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh label create automation-report --color 1f6f55 --description "自動更新の定期報告" --force
            gh issue create --title "$title" --body "$body" --label automation-report
          fi
          if [ "$result" = "失敗" ]; then exit 1; fi
